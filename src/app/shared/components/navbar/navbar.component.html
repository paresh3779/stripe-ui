<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/main/home">Stripe App</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li *ngFor="let item of menu; let i = index" class="nav-item" [ngClass]="{'dropdown': item.children}">
          <a *ngIf="!item.children" class="nav-link" [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">{{item.label}}</a>
          <a *ngIf="item.children" class="nav-link dropdown-toggle" [ngClass]="{'active': isAnyChildActive(item)}" href="#" id="dropdown{{i}}" data-bs-toggle="dropdown" aria-expanded="false">{{item.label}}</a>
          <ul *ngIf="item.children" class="dropdown-menu">
            <li *ngFor="let child of item.children"><a class="dropdown-item" [routerLink]="child.link" routerLinkActive="active">{{child.label}}</a></li>
          </ul>
        </li>
        <li class="nav-item dropdown" *ngIf="user$ | async as user">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            {{ user.first_name }} {{ user.last_name }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" (click)="logout()">Logout</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
