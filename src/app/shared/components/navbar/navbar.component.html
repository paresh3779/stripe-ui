<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/main/home">Stripe App</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li *ngFor="let item of menu; let i = index" class="nav-item" [ngClass]="{'dropdown': item.children}">
          <a *ngIf="!item.children" class="nav-link" [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">{{item.label}}</a>
          <a *ngIf="item.children" class="nav-link dropdown-toggle" href="#" id="dropdown{{i}}" data-bs-toggle="dropdown" aria-expanded="false">{{item.label}}</a>
          <ul *ngIf="item.children" class="dropdown-menu">
            <li *ngFor="let child of item.children"><a class="dropdown-item" [routerLink]="child.link">{{child.label}}</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
